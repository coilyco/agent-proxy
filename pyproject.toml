[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-proxy"
version = "0.1.0"
description = "A reliability proxy for the local agent and LLM fleet, with the reliability proxy as phase 1."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.115.0",
    "boto3>=1.34.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "hypercorn>=0.17.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "prometheus-client>=0.20.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
agent-proxy = "app.main:main"

[project.urls]
"Homepage" = "https://forgejo.coilysiren.me/coilyco-flight-deck/agent-proxy"

[tool.pytest.ini_options]
# The async test cases (queue worker, upstream dispatch, resilience loop) use
# bare `async def` with no per-test marker, so auto mode is what makes them run
# instead of being skipped.
asyncio_mode = "auto"

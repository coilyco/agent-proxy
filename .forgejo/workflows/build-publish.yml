# Publishes the immutable agent-proxy image to Forgejo OCI on every push to main
# (agent-proxy#97), matching the build-publish lane used across the fleet.
#
# The gate job repeats the ci.yml checks on purpose: publish must depend on a
# green gate inside its own workflow, because separate workflows do not wait for
# one another. No deploy stage here - rollout stays driven from
# coilyco-bridge/deploy per the source -> deploy layer invariant.

name: build-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-publish
  cancel-in-progress: false

jobs:
  gate:
    runs-on: docker
    container:
      image: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4
      - name: Tests (just test)
        run: just test
      - name: Lint (just lint)
        run: just lint
      - name: Format check (just format-check)
        run: just format-check
      - name: Types (just typecheck)
        run: just typecheck
      - name: Daemonless boot probe (just boot-probe)
        run: just boot-probe
      - name: Import/build smoke (just smoke)
        run: just smoke
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  publish:
    runs-on: deploy
    needs: [gate]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable image
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: bash scripts/publish-image.sh
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py

# CI gate on a GitHub-hosted runner (COI-3104): pytest, ruff, black, mypy, smoke scripts.
# Why it is shaped this way and what it leaves out: docs/image-publishing.md

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: coilyco/.github/actions/setup-ci@b975f9dbb2a7c7dd7315f4b53dd3212c9b1e2685
        with:
          tools: just uv
      - name: Tests (just test)
        run: just test
      - name: Lint (just lint)
        run: just lint
      - name: Format check (just format-check)
        run: just format-check
      - name: Types (just typecheck)
        run: just typecheck
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: coilyco/.github/actions/setup-ci@b975f9dbb2a7c7dd7315f4b53dd3212c9b1e2685
        with:
          tools: just uv
      - name: Daemonless boot probe (just boot-probe)
        run: just boot-probe
      - name: Import/build smoke (just smoke)
        run: just smoke
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  gate-required:
    name: gate
    needs: [quality, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

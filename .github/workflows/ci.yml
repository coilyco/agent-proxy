# CI gate on a GitHub-hosted runner (COI-3104). Runs the declared dev tooling off
# pyproject.toml so every landing is gated on the same checks a contributor runs
# locally: pytest, ruff, black --check, mypy, plus the two daemonless boot/import
# smoke scripts.
#
# This repo is public, so every job uses `ubuntu-latest` and never the private
# `kai-server` runner (COI-3096): a fork pull request runs here as code from anyone.
# Every step is a justfile verb, and setup-ci installs just and uv.
#
# Deliberately NOT in this gate: test-container.sh (needs a Docker daemon) and the
# tower-dependent scripts/truncation_proof.py + scripts/reliability_loop.py (need
# the tower reachable). Only the daemonless paths run here.
#
# pre-commit is not a step: the hook pin still names the retired Forgejo host
# (COI-3019), which no runner can clone.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: coilyco/agentic-os/actions/setup-ci@df1aee7cf7fd1c36c1eda3523291a76b0cdbbd35
        with:
          tools: just uv
      - name: Tests (just test)
        run: just test
      - name: Lint (just lint)
        run: just lint
      - name: Format check (just format-check)
        run: just format-check
      - name: Types (just typecheck)
        run: just typecheck
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: coilyco/agentic-os/actions/setup-ci@df1aee7cf7fd1c36c1eda3523291a76b0cdbbd35
        with:
          tools: just uv
      - name: Daemonless boot probe (just boot-probe)
        run: just boot-probe
      - name: Import/build smoke (just smoke)
        run: just smoke
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
